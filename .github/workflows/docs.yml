name: DocHTML -- Build

on:
  push:
    branches: [development]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref }}-docs
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependencies
        run: |
          .github/workflows/dependencies/documentation.sh
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Docs/sphinx_doc/requirements.txt

      - name: Build Docs
        run: |
          ./Docs/BuildDocs.sh

#     - name: Check links
#       run: |
#         cd Docs/sphinx_doc
#         make SPHINXOPTS="-v -W --keep-going" NO_DOXYGEN=TRUE linkcheck

      # No deploy step: ERF's docs.yml publishes to erf-model/docs with ERF's key.
      # FLARE has no documentation site yet; the build above is the check.

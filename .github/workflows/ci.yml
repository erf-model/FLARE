name: FLARE CI

# FLARE's build and tests: flare with the fire engine, the dust layer and the structures
# (MoorDyn stub), against ERF (Submodules/ERF) as a library. ERF's own tests run in ERF's CI.
on:
  push:
    branches: [development]
    paths:
      - '**'
      - '!Docs/**'
      - '!**.md'
      - '!**.rst'
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [development]
    paths:
      - '**'
      - '!Docs/**'
      - '!**.md'
      - '!**.rst'
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.head_ref || (github.event_name == 'push' && 'latest') || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

jobs:

  Build-And-Test:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    name: Ubuntu MPICH - fire, dust, structures (stub)
    env:
      CCACHE_TRUNK_KEY: ubuntu-22.04-x64-gcc-mpich-double-flare

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: recursive
        persist-credentials: false

    - name: Free disk space on Ubuntu
      uses: ./.github/actions/free-space-ubuntu

    - name: Handle Dependencies
      run: sudo apt-get install mpich libmpich-dev

    - name: Install CCache
      run: Submodules/ERF/Submodules/AMReX/.github/workflows/dependencies/dependencies_ccache.sh

    - name: Restore Cache
      id: ghcr-cache
      uses: ./.github/actions/ccache-trunk
      with:
        mode: restore
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ~/.cache/ccache
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure CMake
      run: |
        cmake \
          -B${{runner.workspace}}/FLARE/build \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g1 -DNDEBUG" \
          -DAMReX_ASSERTIONS:BOOL=ON \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DERF_ENABLE_MPI:BOOL=ON \
          -DMPI_CXX_COMPILE_OPTIONS=-fno-lto \
          -DMPI_CXX_LINK_FLAGS=-fno-lto \
          -DERF_ENABLE_FIRE:BOOL=ON \
          -DERF_ENABLE_DUST:BOOL=ON \
          -DERF_ENABLE_STRUCTURES:BOOL=ON \
          -DERF_MOORDYN_USE_STUB:BOOL=ON \
          -DERF_ENABLE_ALL_WARNINGS:BOOL=ON \
          -DERF_TEST_NRANKS:STRING=2 \
          -DFLARE_ENABLE_TESTS:BOOL=ON \
          ${{github.workspace}}

    - name: Build
      shell: bash
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        ccache -z
        build_start=$(date +%s)

        cmake --build ${{runner.workspace}}/FLARE/build --parallel "$(nproc)" \
          2>&1 | tee -a ${{runner.workspace}}/build-output.txt;

        echo '```' >> "$GITHUB_STEP_SUMMARY"
        ccache --evict-older-than "$(( $(date +%s) - build_start + 120 ))s"
        ccache -s | tee -a "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    - name: Save Cache
      if: always() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
      uses: ./.github/actions/ccache-trunk
      with:
        mode: save
        key: ${{ env.CCACHE_TRUNK_KEY }}
        path: ~/.cache/ccache
        token: ${{ secrets.GITHUB_TOKEN }}

    # Warnings in FLARE's own sources fail the job; ERF's and its submodules' are ERF's CI's.
    # A warning GCC reports against a system header is attributed to the code it was inlined
    # from (or the translation unit), so ERF code inlined into <bits/...> is dropped too.
    - name: Report
      run: |
        build_log="${{runner.workspace}}/build-output.txt"
        test -r "$build_log"
        python3 .github/tests/build_warnings.py --root "${{github.workspace}}" "$build_log" \
          > ${{runner.workspace}}/build-output-warnings.txt
        cat ${{runner.workspace}}/build-output-warnings.txt
        return=$(tail -n 1 ${{runner.workspace}}/build-output-warnings.txt | awk '{print $2}')
        test "${return}" -eq 0

    - name: Unit Tests
      run: ctest -L unit -j 4 --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/FLARE/build

    - name: Regression Tests
      run: ctest -L regression -j 2 --output-on-failure --no-tests=error
      working-directory: ${{runner.workspace}}/FLARE/build

    - name: Upload CTest logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: flare-test-results
        if-no-files-found: warn
        path: |
          ${{runner.workspace}}/FLARE/build/test-results/**
          ${{runner.workspace}}/FLARE/build/Testing/Temporary/LastTest.log
          ${{runner.workspace}}/FLARE/build/Testing/Temporary/LastTestsFailed.log
